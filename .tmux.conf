# Prefix: C-a (press Ctrl+a, release, then the next key)
# C-a C-a sends Ctrl+a through to the shell (bash "go to beginning of line")
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 256-colour + true colour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Renumber windows on close
set -g renumber-windows on

# Large scrollback; no escape-time delay (important for vim)
set -g history-limit 50000
set -s escape-time 0

# Pass focus events to applications (enables Vim autoread, FocusGained/Lost autocmds)
set -g focus-events on

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Intuitive splits, opening in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Mouse support
set -g mouse on

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -sel clip -i"

# Mouse drag selection → PRIMARY selection (middle-click paste)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -sel primary -i"

# Status bar
set -g status-interval 5
set -g status-left-length 30
